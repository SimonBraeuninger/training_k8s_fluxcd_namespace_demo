---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld
spec:
  rules:
    - host: helloworld.training.jambit.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helloworld
                port:
                  number: 80
  tls:
    - hosts:
        - helloworld.training.jambit.space
      secretName: tls-secret
